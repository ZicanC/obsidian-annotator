<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EPUB.js + Hypothesis Example</title>

  <script type="text/javascript">
    window.hypothesisConfig = function () {
      return {
        openSidebar: false,
        enableMultiFrameSupport: true,
        onLayoutChange: function(state) {
          var nav = document.getElementById("navigation");
          if (state.expanded === true) {
            nav.classList.remove("open");
          }
        }
      };
    };
  </script>
  <script src="https://cdn.hypothes.is/hypothesis"></script>

  <link rel="stylesheet" type="text/css" href="css/reader.css">

</head>
<body>
  <div id="main">
    <button id="opener" type="button" aria-label="Open table of contents">
      <span class="reader-icon" aria-hidden="true">☰</span>
    </button>
    <div id="viewer" class="spreads loading"></div>
    <span id="hiddenTitle"></span>
    <button id="prev" type="button" class="arrow" aria-label="Previous page">
      <span class="reader-icon" aria-hidden="true">‹</span>
    </button>
    <button id="next" type="button" class="arrow" aria-label="Next page">
      <span class="reader-icon" aria-hidden="true">›</span>
    </button>
  </div>
  <div id="navigation">
    <button id="closer" type="button" aria-label="Close table of contents">
      <span class="reader-icon" aria-hidden="true">×</span>
    </button>
    <h1 id="title">...</h1>
    <img id="cover" width="150" alt="" decoding="async" hidden />
    <h2 id="author">...</h2>
    <ul id="toc"></ul>
  </div>

</body>
</html>
